<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>PyQuest · 用 Python 闯关</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 加载 Python 运行环境时的遮罩 -->
<div id="loading" class="overlay">
  <div class="loading-box">
    <div class="robot-big">🤖</div>
    <h2>正在启动 Python 运行环境…</h2>
    <p class="muted">首次加载需要下载约 10 MB，之后浏览器会缓存，快很多。</p>
    <p id="loading-status" class="muted"></p>
  </div>
</div>

<header class="topbar">
  <div class="brand">🤖 PyQuest <span class="sub">用 Python 指挥机器人闯关</span></div>
  <div class="progress">
    <span id="progress-text"></span>
    <div class="bar"><div id="progress-fill"></div></div>
  </div>
</header>

<main class="layout">
  <!-- 左：关卡列表 -->
  <aside class="sidebar">
    <h3>关卡</h3>
    <ul id="level-list"></ul>
    <label class="dev-toggle"><input type="checkbox" id="dev-unlock"> 开发模式：解锁全部关卡</label>
  </aside>

  <!-- 中：地图 + 输出 -->
  <section class="stage">
    <div class="stage-head">
      <h2 id="level-title"></h2>
      <span id="level-concept" class="tag"></span>
    </div>
    <canvas id="board" width="560" height="420"></canvas>
    <div class="controls">
      <button id="btn-run" class="primary">▶ 运行<kbd>⌘/Ctrl + Enter</kbd></button>
      <button id="btn-reset">↺ 重置机器人</button>
      <label>速度
        <select id="speed">
          <option value="420">慢</option>
          <option value="220" selected>中</option>
          <option value="90">快</option>
        </select>
      </label>
    </div>
    <div class="console-wrap">
      <div class="console-head"><span>输出</span><button id="btn-clear" class="link">清空</button></div>
      <div id="console" class="console"></div>
    </div>
  </section>

  <!-- 右：任务 / 知识点 / 代码 / 指令表 -->
  <section class="panel">
    <div class="card">
      <h3>🎯 任务</h3>
      <p id="level-story"></p>
      <p id="level-goal" class="goal"></p>
      <p id="level-rules" class="rules"></p>
      <button id="btn-hint" class="link">💡 看提示</button>
      <p id="level-hint" class="hint hidden"></p>
    </div>

    <div class="card">
      <h3>📘 知识点</h3>
      <div id="level-teach" class="teach"></div>
    </div>

    <div class="card editor-card">
      <div class="editor-head">
        <h3>✏️ 代码</h3>
        <button id="btn-restore" class="link">恢复初始代码</button>
      </div>
      <div class="editor">
        <div id="gutter" class="gutter"></div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>

    <div class="card">
      <h3>🧰 本关可用指令</h3>
      <ul id="commands" class="commands"></ul>
    </div>
  </section>
</main>

<!-- 过关弹窗 -->
<div id="win" class="overlay hidden">
  <div class="win-box">
    <div class="win-emoji">🎉</div>
    <h2 id="win-title">通关！</h2>
    <p id="win-text"></p>
    <div class="win-actions">
      <button id="btn-stay">留在这关</button>
      <button id="btn-next" class="primary">下一关 →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script src="py_runtime.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
